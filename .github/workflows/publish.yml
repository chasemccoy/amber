name: Publish

# Publishes to npm when a version tag is pushed:
#   git tag v0.4.0 && git push --follow-tags
#
# Auth is npm "trusted publishing" (OIDC): the in-amber package's npm settings
# name this repo + workflow as a trusted publisher, so no token or secret is
# involved. `id-token: write` is what lets the job mint the OIDC credential;
# provenance comes from publishConfig in package.json and requires the repo to
# stay public. First-time setup happens on npmjs.com (package → Settings →
# Trusted Publisher); the very first version had to be published locally since
# that page only exists once the package does. A matching GitHub release is
# created after the npm publish succeeds.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # checkout + creating the GitHub release
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the release step can find the previous tag
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a newer npm than Node 24 bundles
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # prepublishOnly runs typecheck + test + build before the tarball is made.
      # access + provenance come from publishConfig in package.json.
      - run: npm publish
      # Mirror the release on GitHub's Releases tab, with notes from the
      # version's CHANGELOG.md section (--generate-notes only works from merged
      # PRs, which a direct-push repo doesn't have).
      - run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '$0 ~ "^## " ver "( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > /tmp/notes.md
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "_No CHANGELOG.md entry for $VER._" > /tmp/notes.md
          fi
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME"^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$PREV" "$GITHUB_REF_NAME" >> /tmp/notes.md
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
